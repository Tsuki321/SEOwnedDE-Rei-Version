name: Build SEOwnedDE DLL

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (ReleaseAVX2 | x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore NuGet packages (if any)
        run: nuget restore "SEOwnedDE/SEOwnedDE.sln"
        shell: powershell

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Show MSBuild info (debug)
        run: |
          Write-Output "--- msbuild available? ---"
          Get-Command msbuild -ErrorAction SilentlyContinue | Format-List
          Write-Output "--- vswhere (installation path) ---"
          & 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe' -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          Get-ChildItem 'C:\Program Files (x86)\Microsoft Visual Studio\**\MSBuild\**\Bin\MSBuild.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 5
        shell: powershell

      - name: Build solution (ReleaseAVX2 | x64)
        run: msbuild "SEOwnedDE/SEOwnedDE.sln" /p:Configuration=ReleaseAVX2 /p:Platform=x64 /m
        shell: powershell

      - name: Verify DLL exists
        run: |
          $dll = "${{ github.workspace }}\SEOwnedDE\bin\ReleaseAVX2\SEOwnedDE.dll"
          if (-not (Test-Path $dll)) { Write-Error "DLL not produced: $dll"; exit 1 }
          Write-Output "Built: $dll"
        shell: powershell

      - name: Upload built DLL
        uses: actions/upload-artifact@v4
        with:
          name: SEOwnedDE-SEOwnedDE.dll
          path: SEOwnedDE/bin/ReleaseAVX2/SEOwnedDE.dll
          retention-days: 7
