name: Feature Unit Tests (Google Test)

on:
  workflow_dispatch:

jobs:
  test_features:
    name: Run Unit Tests (ReleaseAVX2 | x64)
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}\SEOwnedDE\packages
          key: nuget-packages-tests-${{ runner.os }}-${{ hashFiles('SEOwnedDE/**/packages.config', 'tests/**/packages.config') }}
          restore-keys: |
            nuget-packages-tests-${{ runner.os }}-

      - name: Restore MSVC test build cache
        id: msvc-test-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            SEOwnedDE/SEOwnedDE/ipdb
            SEOwnedDE/build/ReleaseAVX2
            SEOwnedDE/build/tests/ReleaseAVX2
            SEOwnedDE/bin/tests/ReleaseAVX2
            SEOwnedDE/**/*.ipdb
            SEOwnedDE/**/*.iobj
          key: msvc-ipdb-tests-v2-x64-${{ runner.os }}-${{ hashFiles('SEOwnedDE/**/*.{cpp,h,rc,vcxproj,vcxproj.filters}', 'tests/cpp/**/*.{cpp,h,vcxproj,vcxproj.filters}', 'SEOwnedDE/**/*.sln') }}
          restore-keys: |
            msvc-ipdb-tests-v2-x64-${{ runner.os }}-

      - name: Restore NuGet packages
        run: nuget restore "SEOwnedDE/SEOwnedDE.sln" -PackagesDirectory "${{ github.workspace }}\SEOwnedDE\packages" -NonInteractive
        shell: powershell

      - name: Build Google Test Project
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { Write-Error "MSBuild not found"; exit 1 }
          & $msbuild "SEOwnedDE/SEOwnedDE.sln" /t:SEOwnedDE_Tests /p:Configuration=ReleaseAVX2 /p:Platform=x64 /p:DebugInformationFormat=ProgramDatabase /p:ProgramDataBaseFileName="$(Get-Location)\SEOwnedDE\SEOwnedDE\ipdb\SEOwnedDE_Tests.pdb" /m
        shell: powershell

      - name: List MSVC test incremental artifacts
        if: always()
        run: |
          Get-ChildItem -Path "SEOwnedDE" -Recurse -Include *.ipdb,*.iobj -ErrorAction SilentlyContinue `
            | Select-Object FullName, Length `
            | Format-Table -AutoSize
        shell: powershell

      - name: Run Features Unit Tests
        run: |
          $testExe = "${{ github.workspace }}\SEOwnedDE\bin\tests\ReleaseAVX2\SEOwnedDE_Tests.exe"
          if (-not (Test-Path $testExe)) { Write-Error "Test executable not produced: $testExe"; exit 1 }
          Write-Output "Running tests: $testExe"
          & $testExe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: powershell

      - name: Save MSVC test build cache
        if: success() && steps.msvc-test-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            SEOwnedDE/SEOwnedDE/ipdb
            SEOwnedDE/build/ReleaseAVX2
            SEOwnedDE/build/tests/ReleaseAVX2
            SEOwnedDE/bin/tests/ReleaseAVX2
            SEOwnedDE/**/*.ipdb
            SEOwnedDE/**/*.iobj
          key: ${{ steps.msvc-test-cache.outputs.cache-primary-key }}
