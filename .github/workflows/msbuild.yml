name: MSBuild

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  msbuild:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [ReleaseAVX2]
        platform: [x64]

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      run: msbuild SEOwnedDE/SEOwnedDE.sln /p:Platform=${{ matrix.platform }} /p:Configuration=${{ matrix.configuration }}
    
    - uses: actions/upload-artifact@v4
      with:
        name: SEOwnedDE-SEOwnedDE.dll
        path: SEOwnedDE/bin/${{ matrix.configuration }}/SEOwnedDE.dll
        retention-days: 7